<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="출처와 확인일을 보여주는 개인용 글로벌 맛집 탐색 도구" />
  <title>mise — 개인 맛집 탐색</title>
  <link rel="icon" href="../public/favicon.svg" type="image/svg+xml" />
  <style>
    :root{--ink:#17221d;--pine:#173e31;--green:#277453;--lime:#d8ff75;--mist:#f4f5f2;--line:#dce2db;--muted:#657169}*{box-sizing:border-box}body{margin:0;background:var(--mist);color:var(--ink);font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1500px;margin:auto;padding:0 32px}header{position:sticky;top:0;z-index:4;background:#f4f5f2e8;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}header .shell{height:73px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:11px;align-items:center}.logo{width:40px;height:40px;border-radius:14px;background:var(--pine);color:var(--lime);display:grid;place-items:center;font-size:20px}.brand b{font-size:19px;letter-spacing:-1px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.private{font-size:14px;color:#55625b}.saved{border:1px solid var(--line);background:white;border-radius:99px;padding:9px 13px;font-weight:700;color:#d95d52}main{padding:30px 0 40px}.intro{display:grid;grid-template-columns:1.35fr .65fr;gap:30px;align-items:end}.eyebrow{font-size:14px;font-weight:700;color:var(--green);margin:0 0 12px}.eyebrow:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#83c98a;margin-right:8px}h1{margin:0;font-size:clamp(34px,4vw,61px);line-height:1.07;letter-spacing:-.065em}h1 em{font-style:normal;color:var(--green)}.intro>p{border-left:2px solid #c4d9c9;padding-left:16px;margin:0;color:#5c6962;font-size:15px;line-height:1.7}.searchbox{margin-top:28px;padding:12px;background:white;border:1px solid #d9e1d8;border-radius:24px;box-shadow:0 16px 40px #22392912}.fields{display:grid;grid-template-columns:1.05fr 1.35fr auto;gap:10px}.field{display:flex;align-items:center;gap:10px;padding:13px 15px;background:#f1f5ef;border-radius:16px}.field span{color:var(--green)}.field input{width:100%;border:0;outline:0;background:transparent;min-width:0;font-size:14px}.find{border:0;border-radius:16px;background:var(--pine);color:#fff;padding:0 26px;font-weight:700}.below{padding:10px 4px 1px;display:flex;justify-content:space-between;gap:15px;align-items:center}.location{color:var(--green);background:transparent;border:0;padding:0;font-size:14px;font-weight:700}.status{font-size:12px;color:#738078}.content{display:grid;grid-template-columns:.94fr 1.06fr;gap:20px;margin-top:20px}.tools,.resulthead{display:flex;justify-content:space-between;gap:10px;align-items:center}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);border-radius:100px;padding:8px 13px;background:white;color:#59675f;font-size:14px}.chip.on{border-color:var(--pine);background:var(--pine);color:white}.filter{border:0;background:transparent;color:#526057;font-size:14px}.resulthead{margin:19px 0 13px}.resulthead p{margin:0;color:#69766f;font-size:14px}.resulthead h2{margin:4px 0 0;font-size:21px;letter-spacing:-.04em}.resulthead h2 span{color:var(--green)}.countnote{font-size:12px;color:#7a867f}.cards{display:grid;gap:12px}.card{overflow:hidden;border:1px solid var(--line);border-radius:22px;background:white;transition:.2s}.card.selected{border-color:#7fba8e;box-shadow:0 10px 30px #1b503317}.cardmain{display:flex;gap:15px;padding:15px}.photo,.icon{width:112px;height:112px;flex:0 0 auto;border-radius:16px;object-fit:cover}.icon{display:grid;place-items:center;background:#eaf2e8;color:#4d8b64;font-size:28px}.details{min-width:0;flex:1}.titleline{display:flex;justify-content:space-between;gap:8px}.name{font-size:18px;font-weight:700;letter-spacing:-.04em}.match{display:inline-block;margin-left:7px;background:#eaf5e9;color:var(--green);border-radius:100px;padding:3px 7px;font-size:11px;font-weight:700}.meta{margin-top:5px;color:#68766e;font-size:14px}.description{margin:11px 0;color:#526057;font-size:14px;line-height:1.45}.heart{border:0;background:transparent;font-size:20px;color:#7d8882}.heart.on{color:#e25e54}.tag{display:inline-block;margin:0 5px 3px 0;padding:5px 7px;border-radius:6px;background:#f1f4f0;color:#657169;font-size:11px}.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;border-top:1px solid #edf0ec;background:#fbfcfa;padding:10px 15px;color:#69766f;font-size:11px}.trust{color:var(--green);font-weight:700}.map{min-height:540px;position:sticky;top:95px;overflow:hidden;border:1px solid #cbd7cb;border-radius:26px;background:radial-gradient(circle at 20% 15%,#fff9 0 2px,transparent 2px),linear-gradient(122deg,transparent 0 38%,#fbf4ddb8 38% 44%,transparent 44%),linear-gradient(25deg,transparent 0 45%,#fff9 45% 49%,transparent 49%),linear-gradient(#d7e6d4,#edf3e7);background-size:22px 22px,100% 100%,100% 100%,100% 100%;box-shadow:0 16px 40px #25503119}.river{position:absolute;left:14%;top:6%;width:36px;height:88%;transform:rotate(21deg);background:#94b9dd99;border-radius:40px}.road{position:absolute;right:18%;top:12%;width:8px;height:70%;transform:rotate(52deg);background:#fff9;border-radius:30px}.maplabel{position:absolute;top:20px;left:20px;background:#fffffff0;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700}.pin{position:absolute;width:36px;height:36px;border:2px solid white;border-radius:50%;display:grid;place-items:center;color:white;box-shadow:0 3px 10px #173e3144;font-size:15px}.pin.main{width:48px;height:48px;left:31%;top:42%;background:var(--pine);font-size:19px;border-width:4px}.p1{left:64%;top:29%;background:#d96e52}.p2{left:72%;top:52%;background:#277453}.p3{left:50%;top:64%;background:#d6963f}.p4{left:23%;top:68%;background:#277453}.p5{left:78%;top:73%;background:#d96e52}.mapcard{position:absolute;left:20px;right:20px;bottom:20px;border-radius:20px;background:#fffffff2;padding:16px;box-shadow:0 10px 25px #16302122}.mapcard small{font-size:11px;font-weight:700;color:#66816d;letter-spacing:.08em}.mapcard h3{margin:4px 0;font-size:18px}.mapcard p{margin:0;color:#657169;font-size:14px}.mapactions{display:flex;gap:8px;margin-top:13px}.route,.source{border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700}.route{border:0;background:var(--pine);color:#fff;flex:1}.source{background:white;border:1px solid var(--line);color:#45554b}@media(max-width:900px){.shell{padding:0 18px}.intro,.content{grid-template-columns:1fr}.map{position:relative;top:auto;min-height:450px}.fields{grid-template-columns:1fr}.find{padding:14px}.private{display:none}}@media(max-width:520px){h1{font-size:36px}.below{align-items:start;flex-direction:column}.photo,.icon{display:none}.cardmain{padding:14px}.foot{justify-content:start}.countnote{display:none}}
  </style>
</head>
<body>
  <header><div class="shell"><div class="brand"><div class="logo">♨</div><div><b>mise</b><small>personal food finder</small></div></div><div class="private">✓ 개인 데이터는 이 기기에만 저장</div><button class="saved" aria-label="저장한 맛집">♥ <span id="saved-count">0</span></button></div></header>
  <main class="shell"><section class="intro"><div><p class="eyebrow">신뢰 가능한 장소를 먼저 보여드려요</p><h1>오늘의 식사는, <em>근거</em>와 함께 고르세요.</h1></div><p>공공 인허가, 지역 검색, 오픈 지도 데이터를 교차 확인해 결과별로 출처와 마지막 확인 시점을 표시합니다.</p></section>
  <section class="searchbox"><div class="fields"><label class="field"><span>⌖</span><input id="location" value="을지로입구역 주변" aria-label="검색 지역"><span>⌄</span></label><label class="field"><span>⌕</span><input id="query" value="조용한 한식 저녁" aria-label="원하는 식당 조건"><span>✦</span></label><button class="find" id="find">탐색하기</button></div><div class="below"><button class="location" id="locate">◉ 현재 위치 사용</button><span class="status" id="status">위치 기반 추천 준비됨</span></div></section>
  <section class="content"><div><div class="tools"><div class="chips" id="chips"><button class="chip on">가까운 순</button><button class="chip">조용한 곳</button><button class="chip">혼밥</button><button class="chip">현지식</button><button class="chip">비건</button></div><button class="filter">☷ 필터</button></div><div class="resulthead"><div><p id="region">을지로입구역 주변</p><h2>추천 결과 <span id="result-count">3</span>곳</h2></div><span class="countnote">출처가 2개 이상인 곳 우선</span></div><div class="cards" id="cards"></div></div>
  <aside class="map"><div class="river"></div><div class="road"></div><div class="maplabel">서울 · 중구</div><div class="pin main">⌖</div><div class="pin p1">♨</div><div class="pin p2">♨</div><div class="pin p3">♨</div><div class="pin p4">♨</div><div class="pin p5">♨</div><div class="mapcard"><small>선택한 장소</small><h3 id="map-name">소울 테이블</h3><p>출처와 확인일을 먼저 확인하세요.</p><div class="mapactions"><button class="route">⌖ 길찾기</button><button class="source">↗ 출처</button></div></div></aside></section></main>
  <script>
    const places=[
      {id:'soul',name:'소울 테이블',cuisine:'컨템퍼러리 한식',where:'서울 · 을지로',distance:'도보 6분',match:'취향 일치 94%',trust:92,source:'공공 인허가 · 카카오 로컬',verified:'오늘 09:30 확인',desc:'제철 식재료 중심의 코스와 단품. 조용한 저녁 식사에 잘 맞습니다.',tags:['예약 추천','혼밥 가능','저녁'],photo:true},
      {id:'noodle',name:'명동 면옥',cuisine:'국수 · 만두',where:'서울 · 명동',distance:'도보 9분',match:'취향 일치 88%',trust:89,source:'공공 인허가 · 관광공사',verified:'어제 18:12 확인',desc:'빠른 식사와 전통 메뉴를 찾을 때 적합한 지역 식당입니다.',tags:['현지식','빠른 식사','가격 합리적']},
      {id:'vegan',name:'하늘채 비건 다이닝',cuisine:'비건 · 퓨전',where:'서울 · 충무로',distance:'도보 12분',match:'취향 일치 83%',trust:84,source:'카카오 로컬 · OSM',verified:'2일 전 확인',desc:'채식 선택지가 명확하고 알레르기 요청을 사전에 안내합니다.',tags:['비건','알레르기 안내','점심']}
    ];
    let saved=JSON.parse(localStorage.getItem('mise-saved-places')||'[]'), selected='soul', filter='가까운 순';
    const cards=document.querySelector('#cards'), savedCount=document.querySelector('#saved-count');
    function render(){const visible=filter==='비건'?places.filter(p=>p.tags.includes('비건')):filter==='혼밥'?places.filter(p=>p.tags.includes('혼밥 가능')):places;document.querySelector('#result-count').textContent=visible.length;savedCount.textContent=saved.length;cards.innerHTML=visible.map((p,i)=>`<article class="card ${selected===p.id?'selected':''}" data-id="${p.id}"><div class="cardmain">${p.photo?'<img class="photo" src="../public/mise-featured-dish.png" alt="제철 한식 요리">':'<div class="icon">♨</div>'}<div class="details"><div class="titleline"><div><span class="name">${p.name}</span><span class="match">${p.match}</span><div class="meta">${p.cuisine} · ${p.where} · ${p.distance}</div></div><button class="heart ${saved.includes(p.id)?'on':''}" data-heart="${p.id}" aria-label="${p.name} 저장">${saved.includes(p.id)?'♥':'♡'}</button></div><p class="description">${p.desc}</p><div>${p.tags.map(t=>'<span class="tag">'+t+'</span>').join('')}</div></div></div><footer class="foot"><span class="trust">✓ 신뢰도 ${p.trust}/100</span><span>✓ ${p.source}</span><span>◷ ${p.verified}</span></footer></article>`).join('');cards.querySelectorAll('.card').forEach(card=>card.onclick=()=>{selected=card.dataset.id;document.querySelector('#map-name').textContent=places.find(p=>p.id===selected).name;render()});cards.querySelectorAll('[data-heart]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();const id=b.dataset.heart;saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem('mise-saved-places',JSON.stringify(saved));render()})}
    document.querySelector('#chips').onclick=e=>{if(e.target.tagName!=='BUTTON')return;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));e.target.classList.add('on');filter=e.target.textContent;render()};
    document.querySelector('#find').onclick=()=>document.querySelector('#status').textContent='“'+document.querySelector('#query').value+'” 조건으로 결과를 정렬했습니다.';
    document.querySelector('#location').oninput=e=>document.querySelector('#region').textContent=e.target.value;
    document.querySelector('#locate').onclick=()=>{const status=document.querySelector('#status');if(!navigator.geolocation){status.textContent='이 브라우저에서는 위치 정보를 지원하지 않습니다.';return}status.textContent='현재 위치를 확인하는 중…';navigator.geolocation.getCurrentPosition(p=>{document.querySelector('#location').value='현재 위치 · '+p.coords.latitude.toFixed(3)+', '+p.coords.longitude.toFixed(3);document.querySelector('#region').textContent=document.querySelector('#location').value;status.textContent='현재 위치를 반영했습니다. 실제 데이터 연결 후 주변 결과가 갱신됩니다.'},()=>status.textContent='위치 권한이 필요합니다. 지역명을 직접 입력해도 됩니다.',{timeout:7000})};render();
  </script>
</body></html>
