name: Deploy mise PWA

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "scripts/sync-daegu-data.mjs"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh Daegu official restaurant data
        run: node scripts/sync-daegu-data.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
